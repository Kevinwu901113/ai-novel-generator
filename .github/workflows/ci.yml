name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'gpt/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # B12：构建产物真启动冒烟（替代原 macOS 打包冒烟——Electron 退役，见 D11）：
      # 真启动 apps/server，验证 index.html 与其引用的 assets 可服务、RPC 认证生效
      - name: Web smoke test
        run: node apps/server/scripts/smoke.mjs
